[project]
name = "data-hub"
version = "0.1.0"
description = "NexusPay Bronze/Silver/Gold lakehouse"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark>=4.0,<5.0",
    "delta-spark>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

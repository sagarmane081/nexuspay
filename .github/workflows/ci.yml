name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  payment-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify

  data-hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
